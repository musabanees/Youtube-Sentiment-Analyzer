name: Deploy Staging

on:
  push:
    branches: [develop]

jobs:
  deploy:
    runs-on: self-hosted
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1
      
      - name: Build, tag, and push staging image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_NAME }}
          IMAGE_TAG: staging
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
      
      - name: Stop old staging container
        run: |
          docker stop cnncls-staging 2>/dev/null || true
          docker rm cnncls-staging 2>/dev/null || true
      
      - name: Pull and run staging container on port 8081
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_NAME }}
        run: |
          docker pull $ECR_REGISTRY/$ECR_REPOSITORY:staging
          docker run -d \
            -p 8081:8080 \
            --name=cnncls-staging \
            --restart unless-stopped \
            -e AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }} \
            -e AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }} \
            -e AWS_REGION=${{ secrets.AWS_REGION }} \
            $ECR_REGISTRY/$ECR_REPOSITORY:staging
      
      - name: Wait for container to start
        run: sleep 15
      
      - name: Health check
        run: |
          if curl -f http://localhost:8081/; then
            echo "✅ STAGING DEPLOYED SUCCESSFULLY"
            echo "🌐 Access at: http://54.156.40.67:8081"
          else
            echo "❌ STAGING DEPLOYMENT FAILED"
            docker logs cnncls-staging --tail 50
            exit 1
          fi
      
      - name: Cleanup old images
        if: success()
        run: docker system prune -f